      tool_setup: >-
        AI-assisted proof drafting, refactoring, and error-loop iteration in
        Claude Code against lake build; the repository's one-cell Colab
        verifier self-certifies via #print axioms that every declaration
        depends only on the standard three axioms.
      cost:
        wall_time: "several weeks of part-time sessions across the development"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Theorem-by-theorem sessions; statements fixed by the author first,
        proofs iterated against the compiler.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Author-directed statement design, mathematical review, and acceptance
        of every theorem; all statements audited by the author against their
        informal descriptions.
      cost:
        wall_time: "included in the sessions above"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    Human-directed, machine-verified workflow: the author fixes statements
    and reviews all mathematics; AI assistance drafts and repairs proofs; the
    Lean kernel is the acceptance criterion. The tightness portion of the
    material was submitted to Mathlib (PR 41847) with the LLM-generated
    label duly applied.

fidelity:
  divergences: >-
    The norm-level results are stated for unital real C*-normed algebras
    (Mathlib's NormedRing + StarRing + CStarRing + NormedAlgebra ℝ, with
    Nontrivial), whereas Landau 1987 and Tsirelson 1980 work with complex
    C*-algebras / operators on complex Hilbert space; the real setting is
    what the M₄(ℝ) instantiation needs, and the C*-identity argument is
    carried out in it directly. Landau's converse (every noncommuting pair
    admits a violating state) is not formalized; the necessity direction is.
    The IsGreatest statement is over 4×4 real matrices specifically — it
    asserts nothing about other dimensions or carriers. The norm results are
    stated in Mathlib's scoped l2 operator norm on M₄(ℝ), named explicitly
    in the Challenge module.

review:
  status: "self-assessed; the tightness portion is under external review at Mathlib (PR 41847)"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    Statements audited by the author; the Mathlib pull request carrying the
    tightness portion received reviewer feedback (docstring corrected
    same-day; placement discussion ongoing), which constitutes partial
    external review of that portion. The exact-constant/characterization
    suite is self-assessed, with the kernel and the axiom audit as the
    acceptance criteria.

alignment:
  namespace: "TsirelsonTightness"
  statements:
    - source: "Tsirelson 1980 (the bound, ordered form)"
      lean: "TsirelsonTightness.chsh_upper"
      module: "Solution"
      status: "proved"
      note: "Generic 2√2 bound for CHSH tuples in an ordered star-ring, from Mathlib's tsirelson_inequality."
    - source: "Landau 1987 (the identity)"
      lean: "TsirelsonTightness.chsh_mul_self"
      module: "Solution"
      status: "proved"
      note: "T² = 4 + [A₀,A₁]·[B₁,B₀] for any CHSH tuple in any *-ring."
    - source: "Tsirelson 1980 / Landau 1987 (the bound, norm form)"
      lean: "TsirelsonTightness.chsh_norm_le"
      module: "Solution"
      status: "proved"
      note: "‖T‖ ≤ 2√2 for every CHSH tuple in every unital real C*-normed algebra, via the Landau identity and the C*-identity."
    - source: "This work (classical constant, exact norm form)"
      lean: "TsirelsonTightness.chsh_norm_of_comm"
      module: "Solution"
      status: "proved"
      note: "One-party commutation forces ‖T‖ = 2 exactly — the classical CHSH constant, not merely an upper bound."
    - source: "This work (necessity; contrapositive of the above)"
      lean: "TsirelsonTightness.noncomm_of_chsh_norm_gt_two"
      module: "Solution"
      status: "proved"
      note: "‖T‖ > 2 forces A₀A₁ ≠ A₁A₀ and B₀B₁ ≠ B₁B₀: noncommutativity within both parties is necessary for any violation."
    - source: "This work (explicit witness)"
      lean: "TsirelsonTightness.tuple_isCHSH"
      module: "Solution"
      status: "proved"
      note: "The real-Pauli quadruple is a genuine CHSH tuple."
    - source: "This work (explicit witness)"
      lean: "TsirelsonTightness.chsh_saturates"
      module: "Solution"
      status: "proved"
      note: "Exact eigen-equation: the CHSH operator sends (1,0,0,1) to (2√2)·(1,0,0,1)."
    - source: "This work"
      lean: "TsirelsonTightness.vsat_ne_zero"
      module: "Solution"
      status: "proved"
      note: "The witness vector is nonzero."
    - source: "CHSH 1969 / Mathlib's CHSH_inequality_of_comm"
      lean: "TsirelsonTightness.classical_le_two"
      module: "Solution"
      status: "proved"
      note: "Commutative bound ≤ 2."
    - source: "Elementary"
      lean: "TsirelsonTightness.bell_gap"
      module: "Solution"
      status: "proved"
      note: "2 < 2√2, so the classical and quantum constants are strictly separated."
    - source: "This work (operator norm)"
      lean: "TsirelsonTightness.chsh_opNorm"
      module: "Solution"
      status: "proved"
      note: >-
        The CHSH operator of the tuple has l2 operator norm exactly 2√2
        (via the C*-identity; scoped Matrix.Norms.L2Operator instances).
    - source: "This work (falsification)"
      lean: "TsirelsonTightness.chsh_sq_ne"
      module: "Solution"
      status: "proved"
      note: >-
        The square of the same CHSH operator is not the scalar 8·1: the
        naive scalar-square route to the norm fails for this representation.
    - source: "This work (the exact constant of M₄(ℝ))"
      lean: "TsirelsonTightness.chsh_opNorm_isGreatest"
      module: "Solution"
      status: "proved"
      note: >-
        IsGreatest: 2√2 is an upper bound on the CHSH operator norm of every
        4×4 real CHSH tuple and is attained — the supremum, achieved.

