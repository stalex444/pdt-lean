# formalization.yaml — Mahler degree-window entry
# Disclosure, byline and license cleared per PI direction, 2026-08-30.
# See TRANSPLANT.md for the ship steps.
project:
  name: "The Mahler degree window: minimal Mahler measures at degrees 2, 3, 4"
  description: >
    For each degree d in {2, 3, 4}, the polynomial x^d - x - 1 attains the
    minimal Mahler measure among monic irreducible integer polynomials of
    degree d with Mahler measure above one, and the three minimal values
    are exactly the golden ratio (M^2 = M + 1), the plastic ratio
    (M^3 = M + 1), and the root of x^4 - x^3 - 1 above one (M^4 = M^3 + 1);
    by Siegel's classical theorem (1944, cited as background, not
    formalized here) the latter two are the smallest and second-smallest
    Pisot numbers. Classically the degree-4 minimizer is not itself a
    Pisot polynomial, yet its measure lands back on the Pisot list via
    the reciprocal transform. The minimizers' irreducibility is part of
    the compared surface. Proofs are
    by a Graeffe-certificate architecture: an effective coefficient-bound
    box from Mathlib's norm_coeff_le_choose_mul_mahlerMeasure, then one
    integer certificate per box element (tie orbit, cyclotomic cofactor,
    explicit factorization, or an iterated Graeffe coefficient bound),
    6,171 + 147 + 21 certificates kernel-decided with plain decide — no
    native_decide anywhere. The exact values follow from a root-inversion
    identity and a (sigma, s)-reduction localizing the conjugate pairs,
    with multiplicity excluded by kernel-certified measure brackets.
  authors:
    - "Stephanie Alexander"
  license: "MIT"  # verified 2026-08-30: matches pdt-lean's LICENSE (MIT)
  responsible_maintainers:
    - "Stephanie Alexander"
classification:
  arxiv:
    - "math.NT"
  msc2020:
    - "11R06"   # Pisot and Salem numbers
    - "11R09"   # polynomials over global fields
    - "12D10"   # location of real zeros
sources:
  - title: "Quantum Mechanics as the Arithmetic of a Complex Place (v8B)"
    # doi 10.5281/zenodo.21971268 — the paper's Edit-8 trace row states the
    # DEGREE-4 minimality instance (with fourfold attainment) that
    # quartic_min formalizes; the full d=2,3,4 window and tie sets are in
    # the deposited computational artifacts beside it (sweep.py,
    # OUTPUT.txt). "formalizes" is claimed for the degree-4 row.
    relationship: "formalizes"
  - title: "C. L. Siegel, Algebraic integers whose conjugates lie in the unit circle, Duke Math. J. 11 (1944), 597-602"
    # doi 10.1215/S0012-7094-44-01152-X; Zbl 0063.07005. Pages and DOI added
    # 2026-08-29 (lit-scout).
    # the identification of rho and theta_4 as the two smallest Pisot
    # numbers, used in the prose reading of the exact-value theorems.
    relationship: "background"
  - title: "D. H. Lehmer, Factorization of certain cyclotomic functions, Ann. of Math. (2) 34 (1933), 461-479"
    # doi 10.2307/1968172 (resolves to JSTOR 1968172; Zbl 0007.19904).
    # Verified 2026-08-29 (lit-scout): Lehmer's text states this entry's
    # three minimality results with this entry's three minimizers. Read as a
    # verbatim quotation in M.-J. Bertin, "From Salem numbers to Mahler
    # measure of K3 surfaces (Lecture 1)", Institut Fourier, under her
    # lead-in "Now I cite Lehmer [Le33]" -- "The best quadratic is x^2-x-1,
    # for which Omega = 1.61803399... The best cubic is x^3-x-1, for which
    # Omega = 1.32471796.. The best quartic is x^4-x-1, for which Omega =
    # 1.380277569..." -- and corroborated independently by Smyth's survey
    # (arXiv:math/0701397v2 section 8.1). NOT read in the 1933 original.
    relationship: "formalizes"
    note: >-
      Lehmer records the same three minimizers and the same three minimal
      values this entry proves: x^2 - x - 1 at 1.61803399..., x^3 - x - 1 at
      1.32471796..., x^4 - x - 1 at 1.380277569.... The relationship is
      scoped to the three minimality theorems and their numerical values.
      Lehmer states neither the three exact-value identities (M^2 = M + 1,
      M^3 = M + 1, M^4 = M^3 + 1) nor the minimizers' irreducibility nor the
      tie sets, and he gives the values as the outcome of an examination,
      not as a completeness certificate -- supplying that certificate, in
      the kernel, is what this entry adds. The result is Lehmer's under the
      standard irreducible reading, which is how the literature states it;
      the unrestricted monic reading is false at degree 4, since the
      reducible quartic (x^3 - x - 1)(x + 1) has measure 1.3247... <
      1.3803.... The paper is also cited as the origin of the
      minimal-measure problem.
  - title: "C. J. Smyth, On the product of the conjugates outside the unit circle of an algebraic integer, Bull. London Math. Soc. 3 (1971), 169-175"
    # Verified 2026-08-29 (lit-scout). Statement and equality case read at
    # Smyth's own survey, arXiv:math/0701397v2 eq. (15). Already banked in
    # references/library.md (line 251, verified 2026-06-22).
    relationship: "independently-proves"
    note: >-
      Scoped to cubic_min ONLY. Smyth proves that a non-reciprocal algebraic
      integer has Mahler measure at least M(x^3 - x - 1) = 1.3247..., with
      equality only for conjugates of (+-theta_0)^(+-1/k). Every monic
      irreducible cubic over Z is non-reciprocal (a reciprocal polynomial of
      odd degree has +1 or -1 as a root), so his theorem covers this entry's
      entire degree-3 competitor class and yields cubic_min; his equality
      case at k = 1 gives the same fourfold degree-3 tie set the
      certificates enumerate. It does NOT give quadratic_min or quartic_min
      (both minima lie strictly above his bound, and reciprocal quartics are
      outside his hypothesis), and it states none of the three exact-value
      identities or the irreducibility theorems.
  - title: "C. Smyth, The Mahler measure of algebraic numbers: a survey, in Number Theory and Polynomials, LMS Lecture Note Series 352, CUP (2008), 322-349"
    # arXiv:math/0701397v2. Read first-hand 2026-08-29: section 8.1
    # attributes the degree-2,3,4 smallest measures to Lehmer 1933 and
    # describes the scope of the Boyd and Mossinghoff tables; eq. (15)
    # states Smyth's 1971 theorem with its equality case. Open access.
    relationship: "background"
    note: >-
      The open-access secondary locus for both classical attributions this
      entry rests on: that the degree 2, 3 and 4 smallest measures are
      Lehmer's (section 8.1), and the statement and equality case of Smyth's
      1971 non-reciprocal bound (eq. 15). Proves nothing formalized here.
  # CLOSED 2026-08-29 (lit-scout), replacing the standing TODO that assumed
  # the small-measure tables hold these minima: THEY DO NOT, and no Boyd or
  # Mossinghoff source belongs here. Checked first-hand -- Mossinghoff's
  # Mahler-Measure-Database tables are floored at measure < 1.3 (and < 1.25),
  # while all three minima exceed 1.3; his BestByDegree_200.txt is even-degree
  # only and its first row is d = 8; Mossinghoff-Rhin-Wu, Exp. Math. 17 (2008)
  # 451-458 determines the minimum only for even 8 <= d <= 54 (zbMATH Zbl
  # 1194.11100); and Boyd, Math. Comp. 35 (1980) 1361-1377 and 53 (1989)
  # 355-357 are restricted to RECIPROCAL polynomials of measure <= 1.3, while
  # every minimizer here is non-reciprocal. The degrees 2, 3, 4 window sits in
  # the gap those tables leave; its published loci are Lehmer 1933 above and
  # Smyth 1971. Source relationships must be precise -- the Gahler lesson.
alignment:
  namespace: "MahlerWindow"
  # ADDED 2026-08-29. This entry compared nine theorems with no claim-to-Lean
  # trace table at all — the only one of the five staged entries missing its
  # alignment block. PI: review each source attribution before submission.
  statements:
    - source: "Lehmer 1933 (the degree-2 minimum; see the source note for what he does and does not state)"
      lean: "MahlerWindow.quadratic_min"
      module: "Solution"
      status: "proved"
      note: >-
        Among monic irreducible integer polynomials of degree 2 with Mahler
        measure above 1, x^2 - X - 1 attains the minimum. Lehmer records the
        same minimizer and value; the completeness certificate is this entry's.
    - source: "this work (exact value; v8B)"
      lean: "MahlerWindow.quadratic_exact"
      module: "Solution"
      status: "proved"
      note: >-
        The minimum M satisfies M^2 = M + 1 exactly, and M > 1 — the golden
        ratio. Not an approximation and not in Lehmer, who gives 1.61803399...
        as a decimal.
    - source: "this work (supporting: the minimizer is irreducible)"
      lean: "MahlerWindow.quadratic_min_irreducible"
      module: "Solution"
      status: "proved"
      note: "x^2 - X - 1 is irreducible over the integers, so it is in the competitor class it minimizes."
    - source: "Lehmer 1933 (the degree-3 minimum) / Smyth 1971 (independently, over the whole non-reciprocal class)"
      lean: "MahlerWindow.cubic_min"
      module: "Solution"
      status: "proved"
      note: >-
        Among monic irreducible integer polynomials of degree 3 with measure
        above 1, x^3 - X - 1 attains the minimum. This is the one row with two
        independent published sources: Lehmer states it, and Smyth's 1971 bound
        for non-reciprocal algebraic integers covers the entire degree-3 class,
        since every monic irreducible cubic is non-reciprocal.
    - source: "this work (exact value; v8B)"
      lean: "MahlerWindow.cubic_exact"
      module: "Solution"
      status: "proved"
      note: "The minimum M satisfies M^3 = M + 1 exactly, and M > 1 — the plastic number."
    - source: "this work (supporting: the minimizer is irreducible)"
      lean: "MahlerWindow.cubic_min_irreducible"
      module: "Solution"
      status: "proved"
      note: "x^3 - X - 1 is irreducible over the integers."
    - source: "Lehmer 1933 (the degree-4 minimum)"
      lean: "MahlerWindow.quartic_min"
      module: "Solution"
      status: "proved"
      note: >-
        Among monic irreducible integer polynomials of degree 4 with measure
        above 1, x^4 - X - 1 attains the minimum. The IRREDUCIBILITY hypothesis
        is essential and not decorative: the unrestricted monic reading is FALSE
        here, since the reducible quartic (x^3 - X - 1)(X + 1) has measure
        1.3247... below this minimum's 1.3803....
    - source: "this work (exact value; v8B)"
      lean: "MahlerWindow.quartic_exact"
      module: "Solution"
      status: "proved"
      note: >-
        The minimum M satisfies M^4 = M^3 + 1 exactly, and M > 1. Note the shape
        differs from the degree 2 and 3 rows — it is not M^4 = M + 1.
    - source: "this work (supporting: the minimizer is irreducible)"
      lean: "MahlerWindow.quartic_min_irreducible"
      module: "Solution"
      status: "proved"
      note: "x^4 - X - 1 is irreducible over the integers."

