fidelity:
  divergences: >-
    The source states the theorem for a complex Hilbert space of any
    dimension, with additivity over countable collections of effects
    (sigma-additivity). This entry is the finite-dimensional case
    (matrices over the complex numbers), and additivity is weakened to
    binary additivity — a weaker hypothesis, so the compared theorem
    implies the paper's finite-dimensional instance. The
    infinite-dimensional sigma-additive statement is not formalized. The
    paper's upper bound f <= 1 on effects is derived in the development,
    not assumed.

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    Statements audited by the author against the source paper's
    hypotheses; the kernel and the axiom audit are the acceptance
    criteria. An in-house adversarial mock-referee pass (2026-08-24) was
    applied to this surface before submission, and its blocking findings
    were fixed (2026-08-25).

alignment:
  namespace: "BuschTheorem"
  statements:
    - source: "Busch 2003 (the theorem, finite-dimensional case)"
      lean: "BuschTheorem.busch_representation"
      module: "Solution"
      status: "proved"
      note: >-
        Existence and uniqueness of the representing density matrix:
        every generalized probability measure on effects satisfies
        f a = trace (rho * a) for exactly one PSD, trace-one rho.
    - source: "Busch 2003 (the homogeneity step of the proof)"
      lean: "BuschTheorem.homogeneity_automatic"
      module: "Solution"
      status: "proved"
      note: >-
        Real homogeneity on the effect interval (scalars in [0,1]) with
        no continuity hypothesis: additivity gives rational homogeneity
        and monotonicity, and a monotone squeeze upgrades to all real
        scalars in [0,1].

