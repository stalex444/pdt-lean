    - source: "Deposited note (the two-rulers identity)"
      lean: "ComplexPlaceArithmetic.two_rulers"
      module: "Solution"
      status: "proved"
      note: >-
        Packaged conjunction: Born = trace∘conjugation; J a Born isometry and
        trace anti-isometry; the Born companion alternating and nondegenerate
        (symplectic); the trace companion symmetric.
    - source: "Deposited note (model of the place)"
      lean: "ComplexPlaceArithmetic.Gborn"
      module: "Challenge"
