# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The exact CHSH constants: Tsirelson's bound in norm form for every CHSH tuple, the classical constant exactly 2 under one-party commutation, and 2√2 as the attained supremum over M₄(ℝ)"
  description: >-
    Kernel-checked exact-constant results for the CHSH operator
    T = A₀B₀ + A₀B₁ + A₁B₀ − A₁B₁ of an arbitrary CHSH tuple (Mathlib's
    IsCHSHTuple: self-adjoint involutions with the A's commuting with the
    B's). (1) The Landau identity: in any *-ring,
    T² = 4 + [A₀,A₁]·[B₁,B₀] — the exact, representation-independent
    correction to the naive T² = 8·1 (chsh_mul_self). (2) Tsirelson's bound
    in norm form: ‖T‖ ≤ 2√2 for every CHSH tuple in every unital real
    C*-normed algebra (chsh_norm_le). (3) The classical constant, exactly:
    if either party's pair commutes, ‖T‖ = 2 — not merely ≤ 2
    (chsh_norm_of_comm). (4) Necessity of noncommutativity: any violation
    ‖T‖ > 2 forces A₀A₁ ≠ A₁A₀ and B₀B₁ ≠ B₁B₀ — noncommutativity within
    both parties is necessary for any violation of the classical bound
    (noncomm_of_chsh_norm_gt_two). (5) The exact constant of M₄(ℝ): in the
    l2 operator norm, 2√2 is the greatest element of the set of CHSH
    operator norms over 4×4 real matrices — an upper bound for every tuple,
    attained by an explicit real-Pauli tuple (chsh_opNorm_isGreatest), so
    the maximal violation 2√2 is possible, not just bounded. The witness
    side stays compared: the explicit quadruple is verified to be a genuine
    CHSH tuple, its CHSH operator has eigenvalue exactly 2√2 on the explicit
    nonzero vector (1,0,0,1) and l2 operator norm exactly 2√2; the ordered
    star-ring bounds T ≤ (2√2)·1 and (commutative case) T ≤ 2 and the strict
    gap 2 < 2√2 complete the picture. A falsification is compared alongside:
    the saturating tuple's T² is NOT the scalar 8·1 (the operator is
    rank-deficient), so the naive scalar-square route to the norm is closed
    for this representation and the results above must go through the
    Landau identity and the C*-identity.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  arxiv: ["quant-ph", "math.OA"]
  msc2020: ["81P40", "81P45", "46L60", "15A18"]

sources:
  - title: "Quantum generalizations of Bell's inequality"
    authors:
      - "Boris S. Tsirelson"
    id: "Letters in Mathematical Physics 4 (1980), 93–100"
    type: "article"
    location: "https://doi.org/10.1007/BF00417500"
    relationship: "formalizes"
    note: >-
      Tsirelson's paper establishes the bound and its attainability. This
      project formalizes both sides at operator level: the norm-form bound
      ‖T‖ ≤ 2√2 for every CHSH tuple in a unital real C*-normed algebra
      (proved via Landau's C*-argument rather than Tsirelson's original
      route), and a machine-checked attainment witness — an explicit
      real-Pauli tuple verified to satisfy the CHSH axioms, with the exact
      eigen-equation and the exact operator-norm equality checked by the
      kernel, packaged as an IsGreatest statement over M₄(ℝ).
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On the violation of Bell's inequality in quantum theory"
    authors:
      - "Lawrence J. Landau"
    id: "Physics Letters A 120, no. 2 (1987), 54–56"
    type: "article"
    location: "https://doi.org/10.1016/0375-9601(87)90075-2"
    relationship: "formalizes"
    note: >-
      Landau's identity T² = 4 + [A₀,A₁]·[B₁,B₀] is formalized as
      chsh_mul_self (for any CHSH tuple in any *-ring), and the norm-level
      suite follows Landau's C*-identity argument: the bound ‖T‖ ≤ 2√2
      (chsh_norm_le), the exact classical constant ‖T‖ = 2 when either
      party's commutator vanishes (chsh_norm_of_comm), and its
      contrapositive, that any violation forces noncommutativity in both
      parties (noncomm_of_chsh_norm_gt_two). Formalized here for real
      C*-normed algebras; Landau's converse direction (every noncommuting
      pair admits a violating state) is not formalized.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Proposed experiment to test local hidden-variable theories"
    authors:
      - "John F. Clauser"
      - "Michael A. Horne"
      - "Abner Shimony"
      - "Richard A. Holt"
    id: "Physical Review Letters 23 (1969), 880–884"
    type: "article"
    location: "https://doi.org/10.1103/PhysRevLett.23.880"
    relationship: "background"
    note: >-
      Origin of the CHSH expression and the classical bound 2. The compared
      classical_le_two (commutative ordered star-ring, via Mathlib's
      CHSH_inequality_of_comm) and chsh_norm_of_comm (norm form, exactly 2)
      are algebraic renderings of that bound, not a formalization of the
      paper's experimental content.
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4 (Mathlib's CHSH development: IsCHSHTuple, CHSH_inequality_of_comm, tsirelson_inequality)"
    relationship: "builds-on"
    note: >-
      The two ordered star-ring bounds (chsh_upper, classical_le_two) are
