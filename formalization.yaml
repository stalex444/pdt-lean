      (chsh_mul_self, chsh_norm_le, chsh_norm_of_comm,
      noncomm_of_chsh_norm_gt_two, chsh_opNorm_isGreatest) is not part of
      that PR.

status:
  scope: >-
    Formalized, 13 compared theorems. Generic: the Landau identity
    T² = 4 + [A₀,A₁]·[B₁,B₀] for any CHSH tuple in any *-ring; the norm-form
    Tsirelson bound ‖T‖ ≤ 2√2 in every unital real C*-normed algebra; the
    exact classical constant ‖T‖ = 2 under one-party commutation; the
    necessity theorem — ‖T‖ > 2 implies noncommutativity within both
    parties; the ordered star-ring bounds T ≤ (2√2)·1 (any star-ring) and
    T ≤ 2 (commutative); and the strict gap 2 < 2√2. Over M₄(ℝ) (Mathlib's
    scoped Matrix.Norms.L2Operator instances): 2√2 is the greatest CHSH
    operator norm (IsGreatest — upper bound for every 4×4 real CHSH tuple,
    attained); the explicit real-Pauli quadruple is verified to be a CHSH
    tuple, with exact eigen-equation on the explicit nonzero vector
    (1,0,0,1), exact operator norm ‖P‖ = 2√2, and the falsification
    P·P ≠ 8·1. No physical claim is part of the compared statements; in
    particular, the compared theorems state that noncommutativity is
    necessary for a violation and that the maximal violation is attained in
    M₄(ℝ) — nothing stronger.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

