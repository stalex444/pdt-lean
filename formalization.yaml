project:
  name: "Busch's theorem: Born-rule uniqueness on quantum effects (finite dimension)"
  description: >-
    Kernel-checked proof of Busch's theorem in finite dimension: every
    generalized probability measure on the effects of a complex matrix
    algebra — nonnegative on effects, additive whenever a sum of effects
    is again an effect, normalized at the identity — is represented by a
    unique density matrix via the trace pairing. Existence and
    uniqueness are both compared (busch_representation). The result is
    the uniqueness of the Born rule in the POVM reading; it is valid in
    every finite dimension (the compared statement assumes only
    [Nonempty n]) and holds already at dimension 2, where Gleason's
    theorem (which requires dimension at least 3) does not apply. No
    continuity is assumed: nonnegativity plus additivity force real
    homogeneity on the effect interval (scalars in [0,1]), compared
    separately as homogeneity_automatic. The compared statements use
    only Mathlib vocabulary (Matrix.PosSemidef, Matrix.trace).
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  arxiv: ["quant-ph", "math-ph"]
  msc2020: ["81P16", "81P15", "46N50"]

sources:
  - title: "Quantum states and generalized observables: a simple proof of Gleason's theorem"
    authors:
      - "Paul Busch"
    id: "Physical Review Letters 91, 120403 (2003)"
    type: "article"
    location: "https://doi.org/10.1103/PhysRevLett.91.120403"
    relationship: "formalizes"
    note: >-
      The paper states the theorem for generalized probability measures
      — sigma-additive over countable collections of effects with sum at
      most the identity — on the effects of a complex Hilbert space,
      with no dimension restriction. This entry formalizes the
      finite-dimensional case, with additivity weakened to binary
      additivity; that is a weaker hypothesis, so the paper's
      finite-dimensional instance follows from the compared theorem. The
      infinite-dimensional sigma-additive statement is not covered by
      this entry. arXiv: quant-ph/9909073 (journal reference matches).
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Measures on the closed subspaces of a Hilbert space"
    authors:
      - "Andrew M. Gleason"
    id: "Journal of Mathematics and Mechanics 6 (1957), 885–893"
    type: "article"
    # DOI verified 2026-08-29 (lit-scout, first-hand): LIVE, and correct.
    # doi.org 302-redirects to a free 9-page scan whose page-1 footer reads
    # verbatim "Journal of Mathematics and Mechanics, Vol. 6, No. 6 (1957)",
    # folio 885, last folio 893. The id line above is the historically
    # correct citation and needs no change. FOR A REFEREE WHO FOLLOWS THE
    # LINK: the publisher registered this DOI in 2013 and retro-labels its
    # whole back run under the journal's current name, so Crossref and the
    # landing page say "Indiana Univ. Math. J. 6 No. 4 (1957), 885-893".
    # Same article. J. Math. Mech. ran from vol. 6 (1957) and became IUMJ at
    # vol. 20; zbMATH (Zbl 0078.28803) records the contemporaneous series
    # under its own ISSN 0095-9057 against IUMJ's 0022-2518. No issue number
    # is given above deliberately: the printed article says No. 6, the
    # publisher's metadata says No. 4.
    location: "https://doi.org/10.1512/iumj.1957.6.56050"
    relationship: "background"
    note: >-
      Cited for the dimension contrast only: Gleason's theorem requires
      dimension at least 3, while the theorem formalized here holds
      already at dimension 2. Gleason's theorem is not formalized in
      this entry. (This is the quantum-measure Gleason theorem; it is
      unrelated to the topological Gleason theorem already in Mathlib.)
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4 (Matrix.PosSemidef, the Hermitian spectral theorem and eigenvector unitary, Unitary.conjStarAlgAut, the trace API)"
    relationship: "builds-on"
    note: >-
      The compared statements use only Mathlib vocabulary
      (Matrix.PosSemidef, Matrix.trace, smul, the real-to-complex
      coercion) — zero custom definitions on the compared surface. The
      proof builds on Mathlib's Hermitian spectral theorem (eigenvalues,
      the eigenvector unitary) and star-algebra conjugation. The
      frame-function development itself — effect frame functions, the
      no-continuity homogeneity bootstrap, the spectral scale/shift
      extension to Hermitian matrices, the entrywise density-matrix
      assembly — has no Mathlib counterpart.
  - id: "https://github.com/leanprover-community/physlib (QuantumInfo POVM development)"
    relationship: "other"
    note: >-
      Physlib defines POVMs (positive semidefinite matrices summing to
      the identity) and measurement channels but contains no
      Busch/Gleason-type representation theorem for effect measures
      (checked 2026-08-24) — adjacent infrastructure, not this theorem.

status:
  scope: >-
    Formalized, 2 compared theorems, finite dimension (matrices over the
    complex numbers, nonempty finite index type). busch_representation:
    existence AND uniqueness — every generalized probability measure on
    effects satisfies f a = trace (rho * a) for exactly one density
    matrix rho (positive semidefinite, trace one).
    homogeneity_automatic: the no-continuity step compared separately —
    nonnegativity plus additivity force f (t • a) = t * f a for every
    effect a and every scalar t in [0,1]. No physical claim is part of
    the compared statements: they assert the unique trace representation
    of effect measures, nothing stronger.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

