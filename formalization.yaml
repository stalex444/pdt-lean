      status: "proved"
      note: "Irreducibility of x³ − x − 1 over ℚ."
    - source: "Selmer 1956 (n = 4)"
      lean: "ComplexPlaceArithmetic.quartic_irreducible"
      module: "Solution"
      status: "proved"
      note: "Irreducibility of x⁴ − x − 1 over ℚ."
    - source: "Deposited note (unit norms)"
      lean: "ComplexPlaceArithmetic.norm_cubic_root"
      module: "Solution"
      status: "proved"
      note: "Algebra.norm ℚ ρ = 1 on AdjoinRoot (x³ − x − 1)."
    - source: "Deposited note (unit norms)"
      lean: "ComplexPlaceArithmetic.norm_quartic_root"
      module: "Solution"
      status: "proved"
      note: "Algebra.norm ℚ Q = −1 on AdjoinRoot (x⁴ − x − 1)."
    - source: "Deposited note (signature certificate, quartic)"
      lean: "ComplexPlaceArithmetic.quartic_congruence"
      module: "Solution"
      status: "proved"
      note: "P4ᵀ·M4·P4 = D4 with diagonal (4, 4, −9/4, 283/36); inertia (3,1) read off by Sylvester in prose."
    - source: "Deposited note (signature certificate, quartic)"
      lean: "ComplexPlaceArithmetic.quartic_gram_det"
      module: "Solution"
      status: "proved"
      note: "det M4 = −283."
    - source: "Deposited note (signature certificate, quartic)"
      lean: "ComplexPlaceArithmetic.quartic_P_unimodular"
      module: "Solution"
      status: "proved"
      note: "det P4 = −1."
    - source: "Deposited note (signature certificate, cubic)"
