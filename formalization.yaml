# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Tightness of the Tsirelson bound: the classical–quantum CHSH gap, saturated by an explicit real-Pauli tuple"
  description: >-
    Kernel-checked, in three beats. (1) Tsirelson's bound in its familiar
    form: any CHSH tuple in an ordered star-ring satisfies
    A₀B₀ + A₀B₁ + A₁B₀ − A₁B₁ ≤ (2√2)·1. (2) The bound is attained: an
    explicit real-Pauli quadruple in M₄(ℝ) — integer matrices up to the one
    scalar (√2)⁻¹ — is verified to be a genuine CHSH tuple (self-adjoint
    involutions, A's commuting with B's), and its CHSH operator has
    eigenvalue exactly 2√2 on the explicit nonzero vector (1, 0, 0, 1).
    (3) In a commutative ordered star-ring the same expression is bounded by
    2, and 2 < 2√2 strictly: the classical–quantum gap is real, and
    noncommutativity is exactly what crosses it. Two operator-norm results
    complete the picture: the CHSH operator of the tuple has l2 operator
    norm exactly 2√2 (chsh_opNorm — the former prose inference, now a
    compared theorem), and yet its square is not the scalar 8·1
    (chsh_sq_ne), so the naive scalar-square route P² = 8·1 ⇒ ‖P‖ = √8 is
    unavailable for this representation.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  arxiv: ["quant-ph", "math.OA"]
  msc2020: ["81P40", "81P45", "46L60", "15A18"]

sources:
  - title: "Quantum generalizations of Bell's inequality"
    authors:
      - "Boris S. Tsirelson"
    id: "Letters in Mathematical Physics 4 (1980), 93–100"
    type: "article"
    location: "https://doi.org/10.1007/BF00417500"
    relationship: "independently-proves"
    note: >-
      Tsirelson's paper establishes the bound and its attainability. This
      project supplies a machine-checked attainment witness: an explicit
      real-Pauli tuple verified to satisfy the CHSH axioms, with the exact
      eigen-equation checked by the kernel.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Proposed experiment to test local hidden-variable theories"
    authors:
      - "John F. Clauser"
      - "Michael A. Horne"
      - "Abner Shimony"
      - "Richard A. Holt"
    id: "Physical Review Letters 23 (1969), 880–884"
    type: "article"
    location: "https://doi.org/10.1103/PhysRevLett.23.880"
    relationship: "background"
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4 (Mathlib's CHSH development: IsCHSHTuple, CHSH_inequality_of_comm, tsirelson_inequality)"
    relationship: "builds-on"
    note: >-
      The two generic bounds are supplied by Mathlib's CHSH development; this
      project contributes the saturation side (the verified tuple and the
      exact eigen-equation) and packages the strict gap.
  - id: "https://github.com/leanprover-community/mathlib4/pull/41847"
    relationship: "other"
    note: >-
      The same tightness material is under review for inclusion in Mathlib
      (PR 41847, review feedback addressed 2026-08-12; placement discussion
      ongoing — main library versus Archive).

status:
  scope: >-
    Formalized: the generic 2√2 upper bound (via Mathlib's
    tsirelson_inequality, rewritten to the 2√2 form); the verification that
    the explicit real-Pauli quadruple is a CHSH tuple; the exact
    eigen-equation of its CHSH operator on the explicit nonzero vector
    (1, 0, 0, 1); the commutative bound ≤ 2; the strict inequality
    2 < 2√2; the exact l2 operator-norm equality ‖P‖ = 2√2 for the tuple's
    CHSH operator (in Mathlib's scoped Matrix.Norms.L2Operator instances);
    and the falsification P·P ≠ 8·1 for the same operator. No physical
    claim is part of the compared statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Anthropic Claude (Opus/Sonnet-class, 2026)"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted proof drafting, refactoring, and error-loop iteration in
        Claude Code against lake build; the repository's one-cell Colab
        verifier self-certifies via #print axioms that every declaration
        depends only on the standard three axioms.
      cost:
        wall_time: "several weeks of part-time sessions across the development"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Theorem-by-theorem sessions; statements fixed by the author first,
        proofs iterated against the compiler.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Author-directed statement design, mathematical review, and acceptance
        of every theorem; all statements audited by the author against their
        informal descriptions.
      cost:
        wall_time: "included in the sessions above"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    Human-directed, machine-verified workflow: the author fixes statements
    and reviews all mathematics; AI assistance drafts and repairs proofs; the
    Lean kernel is the acceptance criterion. The same material was submitted
    to Mathlib (PR 41847) with the LLM-generated label duly applied.

fidelity:
  divergences: >-
    None known. The compared statements are the eigen-equation, the nonzero
    witness, the tuple verification, the two bounds, the operator-norm
    equality ‖P‖ = 2√2, and the falsification P·P ≠ 8·1. The norm equality
    is stated in Mathlib's scoped l2 operator norm on M₄(ℝ), named
    explicitly in the Challenge module.

review:
  status: "self-assessed; the same material is under external review at Mathlib (PR 41847)"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    Statements audited by the author; the Mathlib pull request carrying this
    material received reviewer feedback (docstring corrected same-day;
    placement discussion ongoing), which constitutes partial external review
    of the formalization.

alignment:
  namespace: "TsirelsonTightness"
  statements:
    - source: "Tsirelson 1980 (the bound)"
      lean: "TsirelsonTightness.chsh_upper"
      module: "Solution"
      status: "proved"
      note: "Generic 2√2 bound for CHSH tuples, from Mathlib's tsirelson_inequality."
    - source: "This work (explicit witness)"
      lean: "TsirelsonTightness.tuple_isCHSH"
      module: "Solution"
      status: "proved"
      note: "The real-Pauli quadruple is a genuine CHSH tuple."
    - source: "This work (explicit witness)"
      lean: "TsirelsonTightness.chsh_saturates"
      module: "Solution"
      status: "proved"
      note: "Exact eigen-equation: the CHSH operator sends (1,0,0,1) to (2√2)·(1,0,0,1)."
    - source: "This work"
      lean: "TsirelsonTightness.vsat_ne_zero"
      module: "Solution"
      status: "proved"
      note: "The witness vector is nonzero."
    - source: "CHSH 1969 / Mathlib's CHSH_inequality_of_comm"
      lean: "TsirelsonTightness.classical_le_two"
      module: "Solution"
      status: "proved"
      note: "Commutative bound ≤ 2."
    - source: "Elementary"
      lean: "TsirelsonTightness.bell_gap"
      module: "Solution"
      status: "proved"
      note: "2 < 2√2, so the classical and quantum bounds are strictly separated."
    - source: "This work (operator norm)"
      lean: "TsirelsonTightness.chsh_opNorm"
      module: "Solution"
      status: "proved"
      note: >-
        The CHSH operator of the tuple has l2 operator norm exactly 2√2
        (via the C*-identity; scoped Matrix.Norms.L2Operator instances).
    - source: "This work (falsification)"
      lean: "TsirelsonTightness.chsh_sq_ne"
      module: "Solution"
      status: "proved"
      note: >-
        The square of the same CHSH operator is not the scalar 8·1: the
        naive scalar-square route to the norm fails for this representation.

