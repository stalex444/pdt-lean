      packaging over M₄(ℝ) — together with the verified saturating tuple and
      its exact eigen-equation and operator norm, is this project's
      contribution.
  - id: "https://github.com/leanprover-community/mathlib4/pull/41847"
    relationship: "other"
    note: >-
      The tightness portion of this material (the saturating tuple, its
      verification, the eigen-equation, and the gap packaging) is under
      review for inclusion in Mathlib (PR 41847, review feedback addressed
