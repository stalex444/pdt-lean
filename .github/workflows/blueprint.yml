name: Build Lean project and deploy blueprint

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel an in-progress run when a new commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions required to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Lean project and blueprint
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs elan at the toolchain pinned by lean-toolchain (leanprover/lean4:v4.31.0),
      # then `lake exe cache get` + `lake build`. Mathlib is pinned to v4.31.0 in
      # lake-manifest.json, so the prebuilt Mathlib cache is downloaded rather than rebuilt.
      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs the SAME script the README tells readers to paste into Colab, against this
      # checkout (PDT_LOCAL skips its clone/build stages, which the job has already done).
      # Without this, a green run certified `lake build` only, and a defect in the
      # verifier itself was invisible to CI. The script exits non-zero if any declaration
      # returns no verdict or depends on a non-standard axiom.
      - name: Axiom audit (the published verifier, against this checkout)
        env:
          PDT_LOCAL: ${{ github.workspace }}
        run: python3 colab_oneshot.py

      - name: Install TeX Live (xelatex + latexmk)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-full latexmk
        # texlive-full is the robust choice: it guarantees cleveref, listings,
        # unicode-math, expl3, Latin Modern Math and every package the preamble pulls in.

      - name: Install leanblueprint
        run: |
          python -m pip install --upgrade pip
          pip install leanblueprint invoke

      - name: Build blueprint PDF
        run: leanblueprint pdf

      # `leanblueprint web` runs plasTeX, which (besides the HTML) writes the file
      # blueprint/lean_decls listing every \lean{...} declaration referenced by the
      # blueprint. checkdecls consumes that file, so web MUST run before checkdecls.
      # On failure, surface the actual plastex error as ::error annotations —
      # annotations are readable through the public checks API without
      # authentication, unlike step logs, so the failure diagnoses itself.
      - name: Build blueprint web
        run: |
          set -o pipefail
          if ! leanblueprint web 2>&1 | tee weblog.txt; then
            grep -n -E "ERROR|Error|Traceback|[A-Za-z]*Error|line [0-9]+" weblog.txt \
              | tail -12 | while IFS= read -r l; do
                echo "::error title=plastex::${l}"
              done
            exit 1
          fi

      # Make the compiled PDF downloadable from the published site.
      - name: Copy PDF into web output
        run: |
          mkdir -p blueprint/web
          if [ -f blueprint/print/print.pdf ]; then
            cp blueprint/print/print.pdf blueprint/web/blueprint.pdf
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: blueprint/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
